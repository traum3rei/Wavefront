<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patchbay — sandbox</title>
<style>
  :root {
    --ink: #14161c;
    --panel: #1b1e26;
    --panel-line: #2a2e3a;
    --amber: #e3a548;
    --amber-dim: #6b5530;
    --teal: #4fb3a9;
    --text: #edeae3;
    --text-dim: #8a8d97;
    --danger: #c4574b;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr 240px;
    height: 100vh;
  }

  /* ---- left rack: tools ---- */
  .rack {
    background: var(--panel);
    border-right: 1px solid var(--panel-line);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--amber);
  }
  .brand span { color: var(--text-dim); }

  .rack-group { display: flex; flex-direction: column; gap: 8px; }
  .rack-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--panel-line);
    padding: 9px 10px;
    text-align: left;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover { border-color: var(--amber-dim); }
  button:active { border-color: var(--amber); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }

  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--panel-line);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { outline: 2px solid var(--amber); outline-offset: 2px; }

  .hud {
    margin-top: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.7;
    border-top: 1px solid var(--panel-line);
    padding-top: 12px;
  }
  .hud b { color: var(--teal); }

  /* ---- canvas ---- */
  .stage-wrap { position: relative; background: var(--ink); }
  canvas { display: block; cursor: crosshair; }
  .stage-hint {
    position: absolute;
    top: 16px; left: 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    pointer-events: none;
  }

  /* ---- right: object list ---- */
  .strip {
    background: var(--panel);
    border-left: 1px solid var(--panel-line);
    padding: 20px 14px;
    overflow-y: auto;
  }
  .strip-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .obj-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-bottom: 1px solid var(--panel-line);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  .obj-row:hover { background: rgba(255,255,255,0.02); }
  .obj-row.selected { background: rgba(227,165,72,0.08); }
  .obj-dot { width: 10px; height: 10px; flex-shrink: 0; border-radius: 2px; }
  .obj-meta { color: var(--text-dim); }
  .obj-id { color: var(--text); }
  .empty { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<div class="app">

  <div class="rack">
    <div class="brand">PATCHBAY <span>// sandbox v1</span></div>

    <div class="rack-group">
      <div class="rack-label">ADD OBJECT</div>
      <button id="addCircle">+ circle</button>
      <button id="addRect">+ rectangle</button>
    </div>

    <div class="rack-group">
      <div class="rack-label">COLOR (selected)</div>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="rack-group">
      <div class="rack-label">SELECTED OBJECT</div>
      <button id="deleteObj" class="danger">delete</button>
    </div>

    <div class="hud">
      client id: <b id="clientId"></b><br/>
      objects: <b id="objCount">0</b><br/>
      mode: <b>single-user (step 2)</b><br/>
      next: wire this state over<br/>a websocket (step 3)
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="stage-hint">drag to move &middot; click to select &middot; click empty space to deselect</div>
  </div>

  <div class="strip">
    <div class="strip-title">OBJECTS</div>
    <div id="objList"><div class="empty">nothing yet — add a circle or rectangle</div></div>
  </div>

</div>

<script>
// ---- state, shaped exactly per schema.md, so step 3 (networking) -----------
// only has to add a transport, not redesign this.
const CLIENT_ID = "local-" + Math.random().toString(36).slice(2, 8);
document.getElementById("clientId").textContent = CLIENT_ID;

const COLORS = ["#e3a548", "#4fb3a9", "#c4574b", "#8a8d97", "#edeae3", "#6b5530"];
let objects = {}; // id -> object
let selectedId = null;
let dragging = null; // { id, dx, dy }

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function makeObject(type, x, y) {
  const id = uid();
  const obj = {
    id, type, x, y,
    size: type === "circle" ? 28 : 48,
    color: COLORS[Object.keys(objects).length % COLORS.length],
    version: 1,
    updatedAt: Date.now(),
    updatedBy: CLIENT_ID,
  };
  objects[id] = obj;
  return obj;
}

// Every mutation goes through this single function. This is deliberate:
// when step 3 adds a websocket, this is the one place that needs to also
// broadcast the change — nothing else in the render/interaction code
// needs to know networking exists.
function commitEdit(obj) {
  obj.version += 1;
  obj.updatedAt = Date.now();
  obj.updatedBy = CLIENT_ID;
  objects[obj.id] = obj;
  // TODO(step 3): ws.send(JSON.stringify({ type: "edit", object: obj }))
  render();
}

function deleteObject(id) {
  delete objects[id];
  if (selectedId === id) selectedId = null;
  // TODO(step 3): broadcast a delete message too — schema.md doesn't have
  // one yet, add it when you get here.
  render();
}

// ---- canvas setup ------------------------------------------------------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

function resize() {
  const wrap = document.querySelector(".stage-wrap");
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render();
}
window.addEventListener("resize", resize);

function hitTest(x, y) {
  const list = Object.values(objects);
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i];
    if (o.type === "circle") {
      const d = Math.hypot(x - o.x, y - o.y);
      if (d <= o.size) return o;
    } else {
      const half = o.size / 2;
      if (x >= o.x - half && x <= o.x + half && y >= o.y - half && y <= o.y + half) return o;
    }
  }
  return null;
}

canvas.addEventListener("mousedown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hit = hitTest(x, y);
  selectedId = hit ? hit.id : null;
  if (hit) dragging = { id: hit.id, dx: x - hit.x, dy: y - hit.y };
  render();
});

canvas.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const obj = objects[dragging.id];
  if (!obj) return;
  obj.x = x - dragging.dx;
  obj.y = y - dragging.dy;
  render(); // visual feedback every frame, but no version bump mid-drag
});

canvas.addEventListener("mouseup", () => {
  if (dragging) {
    const obj = objects[dragging.id];
    // Version bumps once per drag, not once per pixel — this is the same
    // batching a real client should do before shipping edits over the wire.
    if (obj) commitEdit(obj);
  }
  dragging = null;
});

// ---- rendering -----------------------------------------------------------
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // faint grid, patchbay-hardware feel
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  const grid = 32;
  for (let x = 0; x < canvas.width; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  for (const obj of Object.values(objects)) {
    ctx.fillStyle = obj.color;
    if (obj.type === "circle") {
      ctx.beginPath();
      ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(obj.x - obj.size / 2, obj.y - obj.size / 2, obj.size, obj.size);
    }
    if (obj.id === selectedId) {
      ctx.strokeStyle = "#e3a548";
      ctx.lineWidth = 2;
      if (obj.type === "circle") {
        ctx.beginPath();
        ctx.arc(obj.x, obj.y, obj.size + 5, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeRect(obj.x - obj.size / 2 - 5, obj.y - obj.size / 2 - 5, obj.size + 10, obj.size + 10);
      }
    }
  }

  renderList();
  renderSwatches();
  document.getElementById("objCount").textContent = Object.keys(objects).length;
}

function renderList() {
  const el = document.getElementById("objList");
  const list = Object.values(objects).sort((a, b) => b.updatedAt - a.updatedAt);
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">nothing yet — add a circle or rectangle</div>';
    return;
  }
  el.innerHTML = list.map(o => `
    <div class="obj-row ${o.id === selectedId ? 'selected' : ''}" data-id="${o.id}">
      <div class="obj-dot" style="background:${o.color}"></div>
      <div>
        <div class="obj-id">${o.type}·${o.id.slice(0,4)}</div>
        <div class="obj-meta">v${o.version} · ${Math.max(0, Math.round((Date.now()-o.updatedAt)/1000))}s ago</div>
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".obj-row").forEach(row => {
    row.addEventListener("click", () => {
      selectedId = row.dataset.id;
      render();
    });
  });
}

function renderSwatches() {
  const el = document.getElementById("swatches");
  const selected = selectedId ? objects[selectedId] : null;
  el.innerHTML = COLORS.map(c => `
    <button class="swatch ${selected && selected.color === c ? 'active' : ''}" style="background:${c}" data-color="${c}"></button>
  `).join("");
  el.querySelectorAll(".swatch").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!selectedId || !objects[selectedId]) return;
      const obj = objects[selectedId];
      obj.color = btn.dataset.color;
      commitEdit(obj);
    });
  });
}

// ---- toolbar ---------------------------------------------------------
document.getElementById("addCircle").addEventListener("click", () => {
  const obj = makeObject("circle", canvas.width / 2 + (Math.random()-0.5)*80, canvas.height / 2 + (Math.random()-0.5)*80);
  selectedId = obj.id;
  render();
});
document.getElementById("addRect").addEventListener("click", () => {
  const obj = makeObject("rect", canvas.width / 2 + (Math.random()-0.5)*80, canvas.height / 2 + (Math.random()-0.5)*80);
  selectedId = obj.id;
  render();
});
document.getElementById("deleteObj").addEventListener("click", () => {
  if (selectedId) deleteObject(selectedId);
});

// tick the "Ns ago" labels without needing an edit
setInterval(renderList, 1000);

resize();
</script>
</body>
</html>
